<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Viron — Search & Ads</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #202124;
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .logo span {
      font-weight: 400;
    }

    nav {
      display: flex;
      gap: 8px;
    }

    nav button {
      background: transparent;
      color: #555;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    nav button:hover {
      background: #f3f4f6;
      transform: none;
    }

    nav button.active {
      background: #111827;
      color: white;
    }

    /* =========================
       SECTIONS
    ========================= */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-page {
      min-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .brand {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -4px;
      margin-bottom: 12px;
    }

    .brand span {
      font-weight: 400;
    }

    .tagline {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 30px;
      text-align: center;
    }

    .search-area {
      width: 100%;
      max-width: 680px;
    }

    .search-box {
      width: 100%;
      height: 58px;
      border: 1px solid #d9d9d9;
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 0 10px 0 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .search-box:focus-within {
      border-color: #777;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
    }

    .search-icon {
      font-size: 21px;
      color: #777;
      margin-right: 12px;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
      color: #202124;
    }

    input::placeholder {
      color: #9aa0a6;
    }

    .primary-btn {
      border: none;
      background: #111827;
      color: white;
      height: 42px;
      padding: 0 22px;
      border-radius: 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary-btn:hover {
      background: #000;
      transform: translateY(-1px);
    }

    .quick {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .quick span {
      border: 1px solid #e5e7eb;
      padding: 8px 14px;
      border-radius: 20px;
      color: #6b7280;
      font-size: 13px;
    }

    .results {
      display: none;
      width: 100%;
      max-width: 760px;
      margin-top: 35px;
    }

    .result {
      padding: 18px 0;
      border-bottom: 1px solid #eee;
    }

    .result-title {
      font-size: 19px;
      color: #174ea6;
      margin-bottom: 6px;
    }

    .result-url {
      font-size: 13px;
      color: #188038;
      margin-bottom: 6px;
    }

    .result-text {
      font-size: 14px;
      color: #5f6368;
      line-height: 1.5;
    }

    .loading {
      color: #6b7280;
      padding: 18px 0;
    }

    .error {
      color: #b91c1c;
      padding: 18px 0;
    }

    /* =========================
       ADS
    ========================= */

    .ads-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 45px 25px 80px;
    }

    .ads-header {
      margin-bottom: 30px;
    }

    .ads-header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .ads-header p {
      color: #6b7280;
      font-size: 15px;
    }

    .ads-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
      color: #374151;
    }

    .field input,
    .field select {
      width: 100%;
      height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    .field input:focus,
    .field select:focus {
      border-color: #111827;
    }

    .create-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      margin-top: 5px;
    }

    .create-btn:hover {
      background: #000;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 13px;
      line-height: 1.4;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    /* =========================
       CAMPAIGNS
    ========================= */

    .campaigns {
      margin-top: 25px;
    }

    .campaigns h2 {
      font-size: 19px;
      margin-bottom: 15px;
    }

    .campaign-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .campaign {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .campaign-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .campaign-info {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.active {
      background: #dcfce7;
      color: #166534;
    }

    .status.paused {
      background: #f3f4f6;
      color: #4b5563;
    }

    .empty {
      color: #9ca3af;
      font-size: 14px;
      padding: 20px 0;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #9ca3af;
      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .ads-grid {
        grid-template-columns: 1fr;
      }

      .ads-page {
        padding: 30px 15px 60px;
      }

      .brand {
        font-size: 50px;
      }

      header {
        padding: 0 15px;
      }

    }

    @media (max-width: 520px) {

      header {
        height: auto;
        padding: 15px;
        flex-direction: column;
        gap: 12px;
      }

      .search-page {
        min-height: calc(100vh - 120px);
      }

      nav button {
        padding: 8px 12px;
      }

      .search-box {
        height: 54px;
      }

      .search-box .primary-btn {
        padding: 0 15px;
      }

      .brand {
        font-size: 44px;
      }

      .tagline {
        font-size: 14px;
      }

    }

  </style>
</head>

<body>

<header>

  <div class="logo">
    Viron <span>Search</span>
  </div>

  <nav>

    <button
      id="searchNav"
      class="active"
      onclick="showPage('search')">
      Viron Search
    </button>

    <button
      id="adsNav"
      onclick="showPage('ads')">
      Viron Ads
    </button>

  </nav>

</header>


<!-- =====================================================
     VIRON SEARCH
===================================================== -->

<section id="searchPage" class="page active">

  <main class="search-page">

    <div class="brand">
      Viron<span>Search</span>
    </div>

    <div class="tagline">
      Pesquise na web de forma simples, rápida e independente.
    </div>

    <div class="search-area">

      <form class="search-box" id="searchForm">

        <div class="search-icon">⌕</div>

        <input
          id="searchInput"
          type="text"
          placeholder="Pesquise na web..."
          autocomplete="off"
        >

        <button class="primary-btn" type="submit">
          Pesquisar
        </button>

      </form>

      <div class="quick">
        <span>Web</span>
        <span>Notícias</span>
        <span>Imagens</span>
      </div>

      <div class="results" id="results"></div>

    </div>

  </main>

</section>


<!-- =====================================================
     VIRON ADS
===================================================== -->

<section id="adsPage" class="page">

  <div class="ads-page">

    <div class="ads-header">

      <h1>Viron Ads</h1>

      <p>
        Crie e gerencie campanhas publicitárias dentro do Viron Search.
      </p>

    </div>


    <div class="ads-grid">


      <!-- CRIAR CAMPANHA -->

      <div class="card">

        <h2>Nova campanha</h2>

        <form id="campaignForm">


          <div class="field">

            <label for="campaignName">
              Nome da campanha
            </label>

            <input
              id="campaignName"
              type="text"
              placeholder="Ex.: Campanha Alemanha"
              required
            >

          </div>


          <div class="field">

            <label for="advertiserName">
              Nome do anunciante
            </label>

            <input
              id="advertiserName"
              type="text"
              placeholder="Nome da empresa ou anunciante"
              required
            >

          </div>


          <div class="field">

            <label for="country">
              País
            </label>

            <select id="country">

              <option value="DE">
                🇩🇪 Alemanha
              </option>

              <option value="BR">
                🇧🇷 Brasil
              </option>

              <option value="FR">
                🇫🇷 França
              </option>

              <option value="UK">
                🇬🇧 Reino Unido
              </option>

              <option value="US">
                🇺🇸 Estados Unidos
              </option>

            </select>

          </div>


          <div class="field">

            <label for="language">
              Idioma
            </label>

            <select id="language">

              <option value="de">
                Alemão
              </option>

              <option value="pt">
                Português
              </option>

              <option value="fr">
                Francês
              </option>

              <option value="en">
                Inglês
              </option>

            </select>

          </div>


          <div class="field">

            <label for="keyword">
              Palavra-chave
            </label>

            <input
              id="keyword"
              type="text"
              placeholder="Ex.: stopwatt"
              required
            >

          </div>


          <div class="field">

            <label for="title">
              Título do anúncio
            </label>

            <input
              id="title"
              type="text"
              placeholder="Título do anúncio"
              required
            >

          </div>


          <div class="field">

            <label for="description">
              Descrição
            </label>

            <input
              id="description"
              type="text"
              placeholder="Descrição do anúncio"
              required
            >

          </div>


          <div class="field">

            <label for="finalUrl">
              URL final
            </label>

            <input
              id="finalUrl"
              type="url"
              placeholder="https://exemplo.com"
              required
            >

          </div>


          <div class="field">

            <label for="cpc">
              CPC máximo
            </label>

            <input
              id="cpc"
              type="number"
              min="0.01"
              step="0.01"
              value="0.50"
              required
            >

          </div>


          <div class="field">

            <label for="dailyBudget">
              Orçamento diário
            </label>

            <input
              id="dailyBudget"
              type="number"
              min="1"
              step="0.01"
              value="10"
              required
            >

          </div>


          <button
            class="create-btn"
            type="submit">

            Criar campanha

          </button>


          <div
            id="campaignMessage"
            class="message">
          </div>


        </form>

      </div>


      <!-- CAMPANHAS -->

      <div class="card">

        <h2>Minhas campanhas</h2>

        <div
          id="campaignList"
          class="campaign-list">

          <div class="empty">
            Carregando campanhas...
          </div>

        </div>

      </div>


    </div>

  </div>

</section>


<footer>
  © 2026 Viron — Search & Ads
</footer>


<script>

  /*
  ======================================================
  API DO VIRON
  ======================================================
  */

  const API_URL = "https://viron-w64u.onrender.com";


  /*
  ======================================================
  NAVEGAÇÃO
  ======================================================
  */

  function showPage(page) {

    const searchPage =
      document.getElementById("searchPage");

    const adsPage =
      document.getElementById("adsPage");

    const searchNav =
      document.getElementById("searchNav");

    const adsNav =
      document.getElementById("adsNav");


    if (page === "search") {

      searchPage.classList.add("active");
      adsPage.classList.remove("active");

      searchNav.classList.add("active");
      adsNav.classList.remove("active");

    }


    if (page === "ads") {

      searchPage.classList.remove("active");
      adsPage.classList.add("active");

      searchNav.classList.remove("active");
      adsNav.classList.add("active");

      loadCampaigns();

    }

  }


  /*
  ======================================================
  VIRON SEARCH
  ======================================================
  */

  const searchForm =
    document.getElementById("searchForm");

  const searchInput =
    document.getElementById("searchInput");

  const results =
    document.getElementById("results");


  searchForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const query =
        searchInput.value.trim();


      if (!query) {

        searchInput.focus();

        return;

      }


      results.style.display = "block";


      results.innerHTML = `
        <div class="loading">
          Pesquisando por "${escapeHtml(query)}"...
        </div>
      `;


      try {

        const response =
          await fetch(
            `${API_URL}/search?q=${encodeURIComponent(query)}`
          );


        if (!response.ok) {

          throw new Error(
            "Erro HTTP: " + response.status
          );

        }


        const data =
          await response.json();


        if (!data.ok) {

          throw new Error(
            "A API retornou um erro."
          );

        }


        /*
        ==============================================
        ANÚNCIOS
        ==============================================
        */

        let adsHtml = "";


        if (
          data.ads &&
          data.ads.length > 0
        ) {

          adsHtml = `

            <div style="
              margin-bottom:20px;
              padding-bottom:10px;
              font-size:12px;
              color:#777;
              border-bottom:1px solid #eee;
            ">
              Anúncios
            </div>

          `;


          data.ads.forEach(ad => {

            adsHtml += `

              <div
                class="result"
                style="
                  border:1px solid #e5e7eb;
                  border-radius:10px;
                  padding:16px;
                  margin-bottom:12px;
                "
              >

                <div
                  style="
                    font-size:11px;
                    color:#777;
                    margin-bottom:5px;
                  "
                >
                  Patrocinado
                </div>

                <a
                  href="${API_URL}/ads/click/${ad.id}"
                  target="_blank"
                  style="
                    font-size:19px;
                    color:#174ea6;
                    text-decoration:none;
                  "
                >
                  ${escapeHtml(ad.title)}
                </a>

                <div
                  class="result-url"
                >
                  ${escapeHtml(ad.final_url)}
                </div>

                <div
                  class="result-text"
                >
                  ${escapeHtml(ad.description)}
                </div>

              </div>

            `;

          });

        }


        /*
        ==============================================
        RESULTADOS ORGÂNICOS
        ==============================================
        */

        let organicHtml = "";


        if (
          !data.results ||
          data.results.length === 0
        ) {

          organicHtml = `

            <div class="result">

              <div class="result-text">
                Nenhum resultado orgânico encontrado.
              </div>

            </div>

          `;

        } else {

          organicHtml =
            data.results.map(result => `

              <div class="result">

                <div class="result-title">
                  ${escapeHtml(result.title)}
                </div>

                <div class="result-url">
                  ${escapeHtml(result.url)}
                </div>

                <div class="result-text">
                  ${escapeHtml(result.description)}
                </div>

              </div>

            `).join("");

        }


        results.innerHTML =
          adsHtml + organicHtml;


    } catch (error) {

      console.error(
        "Erro na pesquisa:",
        error
      );


      results.innerHTML = `

        <div class="result">

          <div class="result-title">
            Não foi possível realizar a pesquisa
          </div>

          <div class="error">
            O Viron Search não conseguiu
            conectar ao servidor.
          </div>

        </div>

      `;

    }

  });


  /*
  ======================================================
  CRIAR CAMPANHA
  ======================================================
  */

  const campaignForm =
    document.getElementById(
      "campaignForm"
    );


  campaignForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const message =
        document.getElementById(
          "campaignMessage"
        );


      message.className =
        "message";


      message.style.display =
        "block";


      message.innerHTML =
        "Criando campanha...";


      const campaign = {

        campaign_name:
          document.getElementById(
            "campaignName"
          ).value.trim(),

        advertiser_name:
          document.getElementById(
            "advertiserName"
          ).value.trim(),

        country:
          document.getElementById(
            "country"
          ).value,

        language:
          document.getElementById(
            "language"
          ).value,

        keyword:
          document.getElementById(
            "keyword"
          ).value.trim(),

        title:
          document.getElementById(
            "title"
          ).value.trim(),

        description:
          document.getElementById(
            "description"
          ).value.trim(),

        final_url:
          document.getElementById(
            "finalUrl"
          ).value.trim(),

        cpc:
          Number(
            document.getElementById(
              "cpc"
            ).value
          ),

        daily_budget:
          Number(
            document.getElementById(
              "dailyBudget"
            ).value
          ),

        status:
          "active"

      };


      try {

        const response =
          await fetch(
            `${API_URL}/ads/campaigns`,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify(campaign)

            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.ok) {

          throw new Error(
            data.error ||
            "Não foi possível criar a campanha."
          );

        }


        message.className =
          "message success";


        message.innerHTML =
          "✓ Campanha criada com sucesso.";


        campaignForm.reset();


        document.getElementById(
          "cpc"
        ).value = "0.50";


        document.getElementById(
          "dailyBudget"
        ).value = "10";


        loadCampaigns();


      } catch (error) {

        console.error(
          "Erro ao criar campanha:",
          error
        );


        message.className =
          "message error";


        message.innerHTML =
          "Erro: " +
          escapeHtml(
            error.message
          );

      }

    }
  );


  /*
  ======================================================
  LISTAR CAMPANHAS
  ======================================================
  */

  async function loadCampaigns() {

    const list =
      document.getElementById(
        "campaignList"
      );


    list.innerHTML = `

      <div class="empty">
        Carregando campanhas...
      </div>

    `;


    try {

      const response =
        await fetch(
          `${API_URL}/ads/campaigns`
        );


      if (!response.ok) {

        throw new Error(
          "Erro HTTP " +
          response.status
        );

      }


      const data =
        await response.json();


      if (
        !data.campaigns ||
        data.campaigns.length === 0
      ) {

        list.innerHTML = `

          <div class="empty">
            Nenhuma campanha criada ainda.
          </div>

        `;

        return;

      }


      list.innerHTML =
        data.campaigns.map(
          campaign => `

            <div class="campaign">

              <div>

                <div class="campaign-name">

                  ${escapeHtml(
                    campaign.campaign_name
                  )}

                </div>

                <div class="campaign-info">

                  ${escapeHtml(
                    campaign.advertiser_name
                  )}

                  ·

                  ${escapeHtml(
                    campaign.country
                  )}

                  ·

                  ${escapeHtml(
                    campaign.language
                  )}

                  <br>

                  Palavra-chave:
                  <strong>
                    ${escapeHtml(
                      campaign.keyword
                    )}
                  </strong>

                  <br>

                  Impressões:
                  ${campaign.impressions || 0}

                  ·

                  Cliques:
                  ${campaign.clicks || 0}

                  ·

                  CPC:
                  ${Number(
                    campaign.cpc || 0
                  ).toFixed(2)}

                </div>

              </div>


              <div>

                <span
                  class="status
                  ${
                    campaign.status === "active"
                    ? "active"
                    : "paused"
                  }"
                >

                  ${
                    campaign.status === "active"
                    ? "Ativa"
                    : "Pausada"
                  }

                </span>

              </div>

            </div>

          `
        ).join("");


    } catch (error) {

      console.error(
        "Erro ao carregar campanhas:",
        error
      );


      list.innerHTML = `

        <div class="empty">

          Não foi possível carregar
          as campanhas.

        </div>

      `;

    }

  }


  /*
  ======================================================
  SEGURANÇA HTML
  ======================================================
  */

  function escapeHtml(text) {

    const div =
      document.createElement(
        "div"
      );

    div.textContent =
      String(text ?? "");


    return div.innerHTML;

  }


</script>

</body>
</html>
